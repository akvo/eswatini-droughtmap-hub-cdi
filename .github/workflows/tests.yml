name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdi-pipeline:
    name: CDI pipeline (STEP_0100 -> 0301 -> 0303)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version the pipeline runs under in production. numpy
          # 2.0.0 and rasterio 1.3.10 both ship cp312 wheels, so no build
          # toolchain or system GDAL is needed.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/data-processing/cdi-scripts/requirements.txt

      - name: Install dependencies
        working-directory: src/data-processing/cdi-scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: src/data-processing/cdi-scripts
        # The tests write into a tmp_path tree and chdir into it, so they need
        # no repo data and touch nothing under the checkout.
        run: pytest __tests__/ -v

  geonode-upload:
    name: GeoNode upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/background-job/requirements.txt

      - name: Install dependencies
        working-directory: src/background-job
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: src/background-job
        # The suite uses relative imports (`from ..upload_to_geonode_job`), so
        # it must be invoked from here with upload_to_geonode as a package.
        # Every network call is mocked - no GeoNode credentials required.
        run: pytest upload_to_geonode/__tests__/ -v
